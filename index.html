<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وقودك - الخرطوم</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
body{background:#fdfde8}
.hidden{display:none!important}
#welcome{
  position:fixed;inset:0;background:#013a2a;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;color:white;text-align:center;z-index:99
}
.w-card{background:white;width:100%;max-width:380px;border-radius:24px;padding:24px;color:#111;text-align:right}
.w-card input{width:100%;padding:14px 16px;border:2px solid #e5e7eb;border-radius:12px;margin-top:8px;margin-bottom:16px;font-size:16px;outline:none}
.w-card button{width:100%;background:#013a2a;color:white;border:none;padding:15px;border-radius:12px;font-size:18px;font-weight:800}
.header{background:#0b3d2e;color:white;padding:24px;text-align:center}
.list{padding:16px;display:flex;flex-direction:column;gap:12px}
.card{background:white;border-radius:16px;padding:16px;display:flex;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.name{font-weight:800;font-size:18px}
.meta{color:#666;font-size:13px}
.badge{padding:10px 16px;border-radius:14px;color:white;font-weight:700}
.green{background:#1a8a4a}.red{background:#c1352e}.orange{background:#e67e17}
</style>
</head>
<body>
<div id="welcome">
  <h1 style="font-size:44px">⛽ وقودك</h1>
  <p style="margin:8px 0 24px;opacity:.9">الخرطوم - يفتح في اي تلفون</p>
  <div class="w-card">
    <label>اسمك</label>
    <input id="name" placeholder="مثلا: أحمد">
    <label>ايميلك</label>
    <input id="email" type="email" placeholder="ahmed@gmail.com">
    <button onclick="login()">دخول للمحطات ⛽</button>
  </div>
</div>

<div id="app" class="hidden">
  <div class="header"><h2>⛽ وقودك</h2><div id="hello" style="margin-top:8px"></div></div>
  <div class="list">
    <div class="card"><div><div class="name">بشاير - الثورة</div><div class="meta">امدرمان - الآن</div></div><div class="badge green">متوفر</div></div>
    <div class="card"><div><div class="name">النيل - العمارات</div><div class="meta">الخرطوم - منذ 10د</div></div><div class="badge red">مافي</div></div>
    <div class="card"><div><div class="name">اويل انرجي - كوبر</div><div class="meta">بحري - منذ 12د</div></div><div class="badge orange">متوسط</div></div>
  </div>
</div>

<script>
let w=document.getElementById('welcome'),a=document.getElementById('app');
if(localStorage.getItem('w_name')){showApp()}
function login(){
  let n=document.getElementById('name').value.trim();
  let e=document.getElementById('email').value.trim();
  if(!n||!e){alert('اكتب اسمك وايميلك');return}
  localStorage.setItem('w_name',n);
  localStorage.setItem('w_email',e);
  showApp()
}
function showApp(){
  w.classList.add('hidden');a.classList.remove('hidden');
  document.getElementById('hello').innerText='مرحب يا '+localStorage.getItem('w_name')+' 👋';
}
</script>
</body>
</html>
