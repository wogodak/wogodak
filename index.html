<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>وقودك</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma}body{background:#FFFBEB} .h{background:#0E4C3E;color:#fff;padding:20px;text-align:center} .s{padding:12px} .s input{width:100%;padding:13px;border-radius:14px;border:1px solid #ddd;text-align:center} .card{background:#fff;margin:10px 14px;border-radius:18px;padding:14px;display:flex;justify-content:space-between;box-shadow:0 4px 10px rgba(0,0,0,0.06)} .badge{padding:5px 12px;border-radius:20px;color:#fff;font-size:12px} .g{background:#2E8B57} .r{background:#C83C3C} .o{background:#E67E22}</style></head><body><div class="h"><h2>⛽ وقودك</h2><small>الخرطوم - يفتح في اي تلفون</small></div><div class="s"><input id="q" placeholder="ابحث... امدرمان، بحري" oninput="fil()"></div><div id="L"></div><script>let d=[{n:"بشاير - الثورة",c:"امدرمان",s:"متوفر",k:"g",t:"الآن"},{n:"النيل - العمارات",c:"الخرطوم",s:"مافي",k:"r",t:"منذ 10د"},{n:"اويل انرجي - كوبر",c:"بحري",s:"متوسط",k:"o",t:"منذ 12د"},{n:"نوافل - امبدة",c:"امدرمان",s:"متوفر",k:"g",t:"منذ 5د"}];function ren(a){L.innerHTML=a.map(x=>`<div class=card><div><b>${x.n}</b><br><small>${x.c} - ${x.t}</small></div><span class="badge ${x.k}">${x.s}</span></div>`).join('')}function fil(){ren(d.filter(x=>x.n.includes(q.value)||x.c.includes(q.value)))}ren(d);</script></body></html>
